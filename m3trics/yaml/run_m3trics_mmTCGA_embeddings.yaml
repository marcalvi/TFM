description: 'M3TRICS mmImmuno progressive missingness study'
executable: /bin/bash
args:
  - -lc
  - |
    set -euo pipefail
    echo "GEB job: mmImmuno"
    echo "CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-unset}"
    nvidia-smi
    /home/osiris-user/Desktop/TFM/m3trics/run_M3TRICS_mmImmuno.sh
env:
  CUDA_VISIBLE_DEVICES: "0"
  PYTHONUNBUFFERED: "1"
worker_type: '5900'
use_gpu: true
privileged: false
max_cpus: 31
max_memory_mb: 110000
docker_image: harbor.vhio.net/geb-env-gpu:0.1.3
mounts: []
max_runtime_minutes: 10000000
open_ports: []