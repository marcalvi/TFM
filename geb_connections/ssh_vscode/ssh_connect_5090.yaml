description: 'Functional test: open ports ssh VSCode'
executable: /bin/bash
args:
- -lc
- |
    set -euo pipefail
    echo "PUBLIC_KEY: $PUBLIC_KEY"
    nvidia-smi
    . /start.sh
worker_type: 5090
use_gpu: true
max_cpus: 16
max_memory_mb: 64000
docker_image: harbor.vhio.net/geb-env-gpu:0.1.2
openports: 
    - external: 9999
      internal: 22
env:
  MY_VAR1: "value1"
  PUBLIC_KEY: "password123"
max_runtime_minutes: 100000
